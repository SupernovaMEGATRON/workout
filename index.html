<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<title>PABLO</title>

<meta name="theme-color" content="#0C0E12" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="PABLO" />

<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon-192.png" />

<!-- Everything is loaded from this folder (no network needed once installed). -->
<link rel="stylesheet" href="vendor/fonts/fonts.css" />
<link rel="stylesheet" href="css/app.css" />
<script src="version.js"></script>
<script src="vendor/tailwind.js"></script>
<script src="js/tailwind-config.js"></script>
</head>

<body class="text-fg min-h-screen">

  <!-- ============ HEADER ============ -->
  <header class="sticky top-0 z-30 bg-ink/90 backdrop-blur border-b border-line"
          style="padding-top: env(safe-area-inset-top);">
    <div class="max-w-xl mx-auto pl-1 pr-4 h-14 flex items-center justify-between gap-2">
      <div class="flex items-center min-w-0">
        <button id="menuBtn" aria-label="Open menu"
                class="num shrink-0 w-12 h-12 flex items-center justify-center text-amber font-bold text-2xl leading-none active:opacity-60">≡</button>
        <h1 id="title" class="font-disp text-lg tracking-tight truncate" style="font-weight:700">PABLO</h1>
      </div>
      <button id="headerStatus" class="hidden shrink-0 text-[11px] text-amber num tracking-widest font-700 border border-amber/50 rounded-full px-2.5 py-1 flag-pulse"></button>
    </div>
  </header>

  <!-- ============ MAIN VIEW ============ -->
  <main id="view" class="max-w-xl mx-auto px-4 pt-4 pb-28"></main>

  <!-- ============ UPDATE BAR ============ -->
  <div id="updateBar" class="hidden fixed inset-x-0 z-30 px-4" style="bottom: calc(4.75rem + env(safe-area-inset-bottom));">
    <div class="max-w-xl mx-auto bg-panel2 border border-amber/50 rounded-2xl pl-4 pr-2 py-2 flex items-center justify-between gap-3 shadow-lg">
      <span class="text-sm">New version available</span>
      <button id="updateBtn" class="bg-amber text-ink font-700 rounded-xl px-4 py-2 text-sm">Update</button>
    </div>
  </div>

  <!-- ============ BOTTOM TABS (of the open module) ============ -->
  <nav id="tabbar" class="hidden fixed bottom-0 inset-x-0 z-30 bg-panel/95 backdrop-blur border-t border-line"
       style="padding-bottom: env(safe-area-inset-bottom);">
    <div id="tabs" class="max-w-xl mx-auto grid"></div>
  </nav>

  <!-- ============ MODULE MENU ============ -->
  <div id="menu" class="hidden fixed inset-0 z-40">
    <div id="menuBackdrop" class="menu-backdrop absolute inset-0 bg-black/70"></div>
    <aside id="menuPanel" class="menu-panel absolute inset-y-0 left-0 w-72 max-w-[82vw] bg-panel border-r border-line flex flex-col"
           style="padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);">
      <div class="h-14 shrink-0 pl-4 pr-1 flex items-center justify-between border-b border-line">
        <span class="font-disp text-lg tracking-tight" style="font-weight:700">PABLO</span>
        <button id="menuClose" aria-label="Close menu" class="w-12 h-12 text-mut text-2xl leading-none active:text-fg">×</button>
      </div>
      <div id="menuList" class="flex-1 overflow-y-auto py-2"></div>
      <div id="menuFoot" class="shrink-0 border-t border-line py-2"></div>
    </aside>
  </div>

  <!-- ============ POPUP ============ -->
  <div id="modal" class="hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center">
    <div id="modalBackdrop" class="absolute inset-0 bg-black/70"></div>
    <div id="modalCard" class="relative w-full max-w-xl bg-panel border-t sm:border border-line rounded-t-2xl sm:rounded-2xl p-5 max-h-[88vh] overflow-y-auto"
         style="padding-bottom: max(1.25rem, env(safe-area-inset-bottom));"></div>
  </div>

  <!-- ============ TOAST ============ -->
  <div id="toast" class="hidden fixed z-[60] left-1/2 -translate-x-1/2 bottom-24 bg-panel2 border border-line text-fg text-sm px-4 py-2.5 rounded-full shadow-lg whitespace-nowrap"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
